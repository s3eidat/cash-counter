<body data-tool="cash-counter">
<main class="s3-main">
  <section class="s3-hero no-print">
    <h1>Cash Counter <span class="cc-ar-h" lang="ar" dir="rtl">عدّاد النقود</span></h1>
    <p>Type how many of each note and coin you have. Totals are exact to the last fils or cent, and you see at once if the drawer is over or short.</p>
  </section>

  <section class="card no-print">
    <div class="row between">
      <label class="field cc-cur">Currency <span class="cc-sub" lang="ar">العملة</span>
        <select class="select" id="cur"></select>
      </label>
      <div class="row">
        <button class="btn ghost small" id="clear"><svg class="i"><use href="#i-trash"/></svg><span id="clear-l">Clear counts</span></button>
      </div>
    </div>
    <div class="cc-custom mt" id="custom" hidden>
      <div class="grid-3">
        <label class="field">Name or code <span class="cc-sub" lang="ar">الاسم</span><input class="input" id="c-name" dir="auto" autocomplete="off" maxlength="24"></label>
        <label class="field">Decimals <span class="cc-sub" lang="ar">الخانات العشرية</span>
          <select class="select" id="c-dec"><option value="0">0 (whole units)</option><option value="2">2 (cents)</option><option value="3">3 (fils)</option></select>
        </label>
        <span></span>
      </div>
      <div class="grid-2 mt">
        <label class="field">Notes <span class="cc-sub" lang="ar">الأوراق النقدية</span><input class="input" id="c-notes" autocomplete="off" placeholder="100, 50, 20, 10, 5"></label>
        <label class="field">Coins <span class="cc-sub" lang="ar">العملات المعدنية</span><input class="input" id="c-coins" autocomplete="off" placeholder="1, 0.5, 0.25, 0.1"></label>
      </div>
      <p class="faint cc-small">Separate values with commas. Changes apply as you type.</p>
    </div>
  </section>

  <div class="cc-grid mt">
    <section class="card no-print">
      <div class="cc-rows" id="rows"></div>
    </section>

    <div class="cc-side">
      <section class="card cc-total-card">
        <span class="faint">Counted <span lang="ar">· المجموع</span></span>
        <b class="cc-total" id="total">0</b>
        <span class="muted" id="pieces"></span>
        <div class="cc-expect no-print">
          <label class="field">Expected amount <span class="cc-sub" lang="ar">المبلغ المتوقع</span>
            <input class="input" id="expected" inputmode="decimal" autocomplete="off" placeholder="e.g. 250">
          </label>
          <div class="cc-diff" id="diff"></div>
        </div>
      </section>

      <section class="card mt no-print">
        <label class="field">Notes <span class="cc-sub" lang="ar">ملاحظات</span>
          <textarea class="textarea prose cc-notes" id="notes" dir="auto" placeholder="Shift, drawer, who counted…"></textarea>
        </label>
        <div class="row mt">
          <button class="btn primary" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy summary</button>
          <button class="btn" id="print"><svg class="i"><use href="#i-file"/></svg>Print</button>
          <button class="btn" id="csv"><svg class="i"><use href="#i-download"/></svg>CSV</button>
        </div>
        <p class="faint cc-small">Counts are saved in this browser for each currency.</p>
      </section>
    </div>
  </div>

  <section class="cc-print" id="sheet" aria-hidden="true"></section>
</main>
<script src="app.js"></script>
</body>
</html>
